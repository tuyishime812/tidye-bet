<!DOCTYPE html>
<html>
<head>
    <title>Clear LocalStorage</title>
</head>
<body>
    <h2>Click to clear localStorage and reload</h2>
    <button onclick="clearAndReload()">Clear & Reload</button>
    
    <script>
        function clearAndReload() {
            localStorage.clear();
            window.location.reload();
        }
        // Auto clear after 1 second
        setTimeout(() => {
            localStorage.clear();
            window.location.href = 'http://localhost:3000';
        }, 500);
    </script>
</body>
</html>
